<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--Import styles-->
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Vue Template</title>
    <!--import Vue.js-->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!--import Axios-->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div id="app"> 
        <div class="nav-bar"></div>
    
        <h1>{{intro}}</h1>

        <div>Name: <input v-model="newParticipant.name"></div>
        <div>Age: <input v-model="newParticipant.age"></div>
        <div>Country: <input v-model="newParticipant.country"></div>

        <button v-on:click="addMethod">Add Participant</button>

        
        <table v-if="participants.length > 0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Country</th>
                </tr>
            </thead>
            <tbody>
                <tbody>
                    <tr v-for="p in participants">
                        <td>{{p.name}}</td>
                        <td>{{p.age}}</td>
                        <td>{{p.country}}</td>
                    </tr>
                </tbody>
            </tbody>
        </table>
        <!--Get All her-->
        <button v-on:click="getAll">Get participants</button>


    </div>
    
<!--Import App-->
<script src="./js/main.js"></script>

<!--Mount App-->
    <script>
    const mountedApp = app.mount('#app')
    </script>
    
</body>
</html>
